# Serviços para o terceiro grupo de testes de integração de IO.
#
# Nada aqui é necessário para rodar os testes do sparquet: sem serviço de pé, os
# testes correspondentes se pulam sozinhos dizendo qual subir (ver `services.py`).
# Subir tudo de uma vez é possível e caro; o uso normal é um por vez:
#
#     docker compose -f tests/io/integration/docker-compose.yml up -d postgres
#     SPARQUET_IT=1 python tests/io/integration/test_jdbc_services_spark.py
#     docker compose -f tests/io/integration/docker-compose.yml down -v
#
# Todas as portas ficam presas a 127.0.0.1 de propósito. São bancos com senha de
# teste, e uma porta publicada em 0.0.0.0 é um banco aberto para a rede local.
#
# Nenhum volume nomeado: um teste que depende de estado sobrevivente de outra
# execução é um teste que mente. `down -v` limpa tudo.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: sparquet
      POSTGRES_USER: sparquet
      POSTGRES_DB: sparquet
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparquet"]
      interval: 5s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: sparquet
      MYSQL_DATABASE: sparquet
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psparquet"]
      interval: 5s
      retries: 20

  # 3307 no host: MariaDB e MySQL brigariam pela 3306 se subissem juntos.
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: sparquet
      MARIADB_DATABASE: sparquet
    ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      retries: 20

  # O healthcheck aqui não é conforto: a porta abre antes de o banco aceitar
  # login, e `services.py` decide rodar o teste sondando a porta. Sem ele o
  # teste falha por banco ainda subindo, o que não é falha de conector.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sparquet!2024"
    ports: ["127.0.0.1:1433:1433"]
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      retries: 20

  # Imagem gratuita da Oracle (sem licença para produção, boa para teste).
  # É a mais lenta a subir de todas — minutos, não segundos.
  oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: sparquet
    ports: ["127.0.0.1:1521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      retries: 40

  # KRaft: sem ZooKeeper. O `ADVERTISED_LISTENERS` precisa ser o endereço que o
  # Spark usa de fora do container, senão o cliente conecta e é redirecionado
  # para um host que não existe na máquina.
  kafka:
    image: apache/kafka:3.9.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  mongodb:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      retries: 20

  cassandra:
    image: cassandra:5
    ports: ["127.0.0.1:9042:9042"]
    environment:
      # Cassandra reserva memória com folga; num container de teste isso vira
      # swap e a suíte inteira fica lenta.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 10s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    ports: ["127.0.0.1:9200:9200"]
    environment:
      discovery.type: single-node
      # Sem TLS nem senha: é um serviço efêmero em 127.0.0.1, e ligar segurança
      # aqui só faria o teste carregar certificado sem provar nada de conector.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m

  # 9201 no host: Elasticsearch e OpenSearch usam 9200 dentro do container.
  opensearch:
    image: opensearchproject/opensearch:2
    ports: ["127.0.0.1:9201:9200"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
