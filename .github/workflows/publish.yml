name: Publish to PyPI

# Deploy automatizado: testes → build → publish.
#
#   • Publicar um GitHub Release  → roda testes, faz build e publica no PyPI.
#   • Rodar manualmente (Actions → "Run workflow") → mesma esteira, mas publica
#     no TestPyPI (ensaio, sem afetar o pacote real).
#
# A publicação usa Trusted Publishing (OIDC): nenhum token/segredo manual — basta
# configurar este repo como "trusted publisher" em pypi.org e test.pypi.org.
# Ver docs/DEPLOY_PYPI.md.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  # 1) Testes puros (sem Java/Spark real): rodam com pyspark instalado e valem
  #    como portão — build/publish só acontecem se estes passarem.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        env:
          PYTHONPATH: .
        run: |
          # Discovered, not listed: a new tests/**/test_*.py runs automatically, and
          # a deleted one fails loudly instead of silently dropping out of coverage.
          # `case-of-success` is excluded on purpose — those are pytest tests for a
          # real migration case and need fixtures this job does not carry.
          fail=0
          for f in $(find tests -name 'test_*.py' -not -path '*case-of-success*' | sort); do
            echo "::group::$f"
            python "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # 2) Build do sdist + wheel e checagem de metadados (twine check).
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build + check
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 3a) Release publicado → PyPI real.
  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sparquet/
    permissions:
      id-token: write  # OIDC — Trusted Publishing, sem token manual
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # 3b) Execução manual → TestPyPI (ensaio de release).
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sparquet/
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
