name: CI

# Testes em cada push/PR na main. São os mesmos testes puros do portão de release
# (sem Java/Spark real), rodados numa matriz de versões de Python.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        env:
          PYTHONPATH: .
        run: |
          # Discovered, not listed: a new tests/**/test_*.py runs automatically, and
          # a deleted one fails loudly instead of silently dropping out of coverage.
          # `case-of-success` is excluded on purpose — those are pytest tests for a
          # real migration case and need fixtures this job does not carry.
          fail=0
          for f in $(find tests -name 'test_*.py' -not -path '*case-of-success*' | sort); do
            echo "::group::$f"
            python "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
