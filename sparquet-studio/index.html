<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sparquet Studio — visual, AI-assisted editor for Sparquet JSON data pipelines. Design, validate and run data engineering workflows in your browser."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Sparquet Studio</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      ;(() => {
        try {
          // An explicit choice wins; otherwise follow the browser.
          const stored = localStorage.getItem('sparquet-studio:theme')
          const system = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' ? stored : system
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
