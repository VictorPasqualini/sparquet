<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sparquet Studio — visual, AI-assisted editor for Sparquet JSON data pipelines. Design, validate and run data engineering workflows in your browser."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Light is the app default, so the browser chrome matches it. -->
    <meta name="theme-color" content="#ffffff" />
    <title>Sparquet Studio</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      ;(() => {
        try {
          // Light is the default; the OS preference does not override it, only
          // an explicit choice the user made in Settings does.
          const stored = localStorage.getItem('sparquet-studio:theme')
          document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
