<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sparquet Studio — visual, AI-assisted editor for Sparquet JSON data pipelines. Design, validate and run data engineering workflows in your browser."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Sparquet Studio</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      ;(() => {
        try {
          const stored = localStorage.getItem('sparquet-studio:theme')
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
