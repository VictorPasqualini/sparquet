[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spark-framework"
version = "0.2.0"
description = "JSON-driven Spark pipeline framework for ingestion, transformation, and data quality"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pyspark>=3.4.0",
]

[project.optional-dependencies]
# Instala suporte a Delta Lake fora do Databricks (OSS)
# pip install spark-framework[delta]
delta = ["delta-spark>=3.0.0"]
all   = ["delta-spark>=3.0.0"]

[project.scripts]
spark-framework = "main:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*", "docs*"]
