[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparquet"
# Versão é fonte única em sparquet/__init__.py (__version__), lida
# dinamicamente abaixo via [tool.setuptools.dynamic]. Para subir de versão,
# altere apenas o __version__.
dynamic = ["version"]
description = "JSON-driven Spark pipeline framework for ingestion, transformation, and data quality"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Victor Pasqualini" }]
keywords = ["spark", "pyspark", "pipeline", "etl", "databricks", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # 3.14 exige pyspark >= 4.2.0. Não dá para expressar isso em `dependencies`
    # (a marca seria `pyspark>=4.2; python_version>="3.14"`, e isso obrigaria
    # todo mundo que já tem 4.1 a subir de linha do Spark ao instalar), então
    # fica declarado aqui e explicado no README: em 4.1.1 o worker morre com
    # `Python worker exited unexpectedly (crashed)`, sem dizer por quê.
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyspark>=3.4.0",
    # Motor de qualidade de dados, extraído para pacote próprio (repo/PyPI
    # separados). O bloco `validations` e os shims `sparquet.validation.*`
    # rodam sobre ele. O sparquet-cola é mantido sempre retrocompatível, então
    # sem cap de versão. Import: `sparquet_cola`.
    # Piso 0.4.0: a medição em passada única (`BaseCheck.aggregations()` e o
    # `Cola.run` que junta as regras num só `df.agg`) não existe antes dela, e
    # sem isso o bloco `validations` volta a gastar uma action por regra.
    "sparquet-cola>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/VictorPasqualini/sparquet"
Repository = "https://github.com/VictorPasqualini/sparquet"
"Bug Tracker" = "https://github.com/VictorPasqualini/sparquet/issues"

[project.optional-dependencies]
# pip install sparquet[delta]  →  OSS Delta fora do Databricks
delta = ["delta-spark>=3.0.0"]
all   = ["delta-spark>=3.0.0"]
# Ferramental de desenvolvimento; nada aqui entra no runtime da lib. As versões
# são fixas de propósito: lint que muda de regra sozinho quebra CI em PR que não
# mexeu no código apontado.
dev = [
    "ruff==0.16.6",
    # `[toml]` não é enfeite: a configuração de cobertura mora neste pyproject, e
    # o coverage só lê TOML sozinho a partir do 3.11 (`tomllib` na stdlib). Sem o
    # extra, no Python 3.9 do CI ele morre antes de medir qualquer coisa com
    # `Can't read 'pyproject.toml' without TOML support. Install with [toml] extra`.
    "coverage[toml]>=7.6",
]

[project.scripts]
sparquet = "sparquet.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sparquet.__version__" }

[tool.setuptools]
# Distribuição é SÓ o pacote `sparquet`. O motor de DQ `sparquet_cola` agora é um
# pacote separado (declarado em dependencies). A lista é explícita, e não um
# `find`, por dois motivos: nenhuma outra pasta do repositório —
# `sparquet-studio/` (frontend), `docs/`, `tests/` — entra no wheel/sdist por
# acidente, e `sparquet.examples` só existe por causa do mapeamento abaixo, que
# um `find` não descobriria. Subpacote novo aqui esquecido quebra
# `tests/test_packaging.py`, que compara esta lista com o que existe em disco.
packages = [
    "sparquet",
    "sparquet.core",
    "sparquet.io",
    "sparquet.observability",
    "sparquet.transform",
    "sparquet.utils",
    "sparquet.validation",
    "sparquet.examples",
]

[tool.setuptools.package-dir]
# Os JSON de exemplo moram em `examples/`, na raiz do repositório — é para lá que
# a documentação aponta — e viajam dentro do wheel como `sparquet.examples`.
# Eles não são só ilustração: são as fixtures que prendem o compilador do Studio
# ao JSON que este framework de fato executa, e o Studio, como repositório
# separado, só alcança o que o pacote instalado carrega. Quem quiser o caminho
# em tempo de execução usa `sparquet.examples_path()`.
"sparquet.examples" = "examples"

[tool.setuptools.package-data]
"sparquet.examples" = ["*.json"]

[tool.ruff]
# O piso de suporte é 3.9 (ver `requires-python`). Sem isto o ruff assume a
# versão do interpretador que o está rodando e passa a exigir sintaxe que não
# existe em 3.9 — `list[str]` em annotation avaliada, `X | None` em assinatura —
# transformando o gate num pedido de quebra de compatibilidade.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Erro real, não estilo: `E`/`W` (pycodestyle) e `F` (pyflakes) pegam import não
# usado, nome indefinido, variável sobrescrita, `except` vazio. As famílias de
# modernização (`UP`) ficam de fora justamente porque reescreveriam o código para
# sintaxe de 3.10+.
select = ["E", "W", "F"]
# Comprimento de linha é decisão de formatação, e o repositório não é formatado
# por ferramenta. Medido: 25 linhas passam de 100 colunas, nenhuma por descuido.
ignore = ["E501"]

[tool.coverage.run]
# `-p` (paralelo) porque a suíte roda um arquivo por processo; `combine` junta.
source = ["sparquet"]
parallel = true

[tool.coverage.report]
exclude_also = [
    # Trecho que só existe para o type checker.
    "if TYPE_CHECKING:",
    # Guarda de execução direta: todo teste tem uma, nenhuma é lógica.
    'if __name__ == .__main__.:',
    "raise NotImplementedError",
]
